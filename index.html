<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TODO — TheOne Testing</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Todo</h1>

      <form id="todo-form" class="todo-form" aria-label="Add todo">
        <input id="todo-input" placeholder="Add a new task and press Enter" autocomplete="off" />
        <button type="submit">Add</button>
      </form>

      <section class="controls">
        <div class="counts"><span id="remaining">0</span> remaining</div>
        <div class="actions">
          <button id="clear-completed">Clear completed</button>
          <button id="reset-all">Reset</button>
        </div>
      </section>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
